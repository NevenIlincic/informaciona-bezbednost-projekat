<div class="login-container">
<div class="login-box">
  <h2 class="title">Login</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label class="label">Email</label>
      <input type="email" formControlName="email" class="input" placeholder="Enter your email" />
    </div>

    <div class="form-group">
      <label class="label">Password</label>
      <input type="password" formControlName="password" class="input" placeholder="Enter your password" />
    </div>

    <div class="error-text" *ngIf="errorMessage">{{ errorMessage }}</div>

    <button type="submit" class="btn-primary">Login</button>
  </form>

  <div class="register-section">
    <span>Don't have an account?</span>
    <button [routerLink]="[ '/', 'register' ]" class="btn-secondary">Register</button>
  </div>
</div>

</div>
