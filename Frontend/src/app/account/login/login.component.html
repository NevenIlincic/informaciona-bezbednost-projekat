<div class="login-container">
<div class="login-box">
  <h2 class="title">Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input formControlName="email" type="email" placeholder="Enter your email" />
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error">
          Valid email is required.
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input formControlName="password" type="password" placeholder="Enter your password" />
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error">
          Password is required.
        </div>
      </div>

      <button type="submit" [disabled]="isSubmitting || loginForm.invalid" class="btn-primary">
        {{ isSubmitting ? 'Logging in...' : 'Login' }}
      </button>
    </form>

  <div class="register-section">
    <span>Don't have an account?</span>
    <button [routerLink]="[ '/', 'register' ]" class="btn-secondary">Register</button>
  </div>
</div>

</div>
