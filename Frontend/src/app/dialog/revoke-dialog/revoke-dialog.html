<div class="dialog">
    <h2 class="title">ENTER REVOCATION REASON</h2>
    <form [formGroup]="dialogForm" (ngSubmit)="sendDataAndClose()" class="form">
        <input type="text" placeholder="Revocation reason:" formControlName="reasonInput" />
        <div *ngIf="dialogForm.get('reasonInput')?.invalid && dialogForm.get('reasonInput')?.touched" class="error">
            Reason required.
        </div>
        <button type="submit" class="btn-primary">CONFIRM</button>
    </form>


</div>
